[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synaptic-fold"
version = "2.0.0"
description = "Zero-Shot Recurrent Cortical Folding and Neuromorphic Execution with Zero-Scatter Indexed-GEMM for Transformer LLMs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Umberto Altieri", email = "altieriumb7@gmail.com" }
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "safetensors>=0.4.0",
    "psutil>=5.9.0",
    "datasets>=2.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
